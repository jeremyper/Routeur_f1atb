<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 900" width="580" height="900" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Placement des sondes de température du ballon d'eau chaude</title>
  <defs>
    <linearGradient id="eau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4572e"/>
      <stop offset="0.45" stop-color="#ef8a4c"/>
      <stop offset="0.62" stop-color="#c9a6a0"/>
      <stop offset="0.78" stop-color="#7fb0e0"/>
      <stop offset="1" stop-color="#3f7fd6"/>
    </linearGradient>
  </defs>

  <!-- Fond clair, lisible aussi en thème sombre -->
  <rect x="0" y="0" width="580" height="900" rx="14" fill="#ffffff"/>

  <!-- Isolant puis cuve -->
  <rect x="60" y="40" width="176" height="490" rx="44" fill="#e9e4da" stroke="#b9b2a5" stroke-width="2"/>
  <rect x="76" y="56" width="144" height="458" rx="32" fill="url(#eau)" stroke="#6b7280" stroke-width="2"/>

  <!-- Tube interne de puisage d'eau chaude (prend l'eau en haut) -->
  <rect x="103" y="78" width="10" height="436" fill="#9ca3af" opacity="0.85"/>
  <!-- Diffuseur d'eau froide en bas -->
  <rect x="160" y="494" width="44" height="6" rx="3" fill="#1e3a8a"/>
  <rect x="179" y="500" width="8" height="14" fill="#1e3a8a"/>

  <!-- Résistance (épingle) et doigt de gant du thermostat -->
  <path d="M128 514 V420 Q128 410 136 410 Q144 410 144 420 V514" fill="none" stroke="#374151" stroke-width="5"/>
  <rect x="150" y="402" width="11" height="112" rx="5" fill="#4b5563"/>

  <!-- Raccords sous le ballon -->
  <rect x="103" y="530" width="10" height="44" fill="#dc2626"/>
  <rect x="179" y="530" width="10" height="44" fill="#2563eb"/>
  <text x="108" y="594" font-size="14" font-weight="700" fill="#dc2626" text-anchor="middle">Eau chaude</text>
  <text x="184" y="612" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">Eau froide</text>

  <!-- Mauvais emplacement : sur le tuyau d'eau chaude -->
  <g stroke="#dc2626" stroke-width="3.5" stroke-linecap="round">
    <line x1="80" y1="544" x2="94" y2="558"/>
    <line x1="94" y1="544" x2="80" y2="558"/>
  </g>

  <!-- Séparation du modèle : deux moitiés -->
  <line x1="76" y1="285" x2="236" y2="285" stroke="#111827" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="166" y="190" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">moitié haute</text>
  <text x="166" y="208" font-size="13" fill="#ffffff" text-anchor="middle">= T° du haut</text>
  <text x="168" y="345" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">moitié</text>
  <text x="168" y="362" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">basse</text>
  <text x="168" y="379" font-size="13" fill="#ffffff" text-anchor="middle">= T° du bas</text>

  <!-- Repère du tiers inférieur -->
  <path d="M46 362 V514" stroke="#6b7280" stroke-width="2"/>
  <path d="M40 362 H52 M40 514 H52" stroke="#6b7280" stroke-width="2"/>
  <text x="34" y="444" font-size="15" font-weight="700" fill="#4b5563" text-anchor="middle">⅓</text>

  <!-- Sonde du HAUT -->
  <line x1="228" y1="104" x2="262" y2="104" stroke="#d97706" stroke-width="2"/>
  <circle cx="228" cy="104" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="2.5"/>
  <text x="270" y="90" font-size="16" font-weight="800" fill="#b45309">① Sonde du HAUT</text>
  <text x="270" y="110" font-size="14" fill="#1f2937">facultative · près de la sortie</text>
  <text x="270" y="128" font-size="14" fill="#1f2937">d'eau chaude, contre la cuve</text>
  <text x="270" y="150" font-size="14" fill="#4b5563">→ affine la réserve d'eau chaude</text>
  <text x="270" y="168" font-size="14" fill="#4b5563">→ température au robinet</text>

  <!-- Modèle -->
  <text x="270" y="280" font-size="14" font-weight="700" fill="#111827">- - - 2 moitiés de même volume</text>
  <text x="270" y="298" font-size="13" fill="#4b5563">chacune comptée à part : un bas</text>
  <text x="270" y="314" font-size="13" fill="#4b5563">froid n'efface pas l'eau chaude du haut</text>

  <!-- Sonde du BAS -->
  <line x1="228" y1="362" x2="262" y2="362" stroke="#15803d" stroke-width="2"/>
  <circle cx="228" cy="362" r="9" fill="#22c55e" stroke="#ffffff" stroke-width="2.5"/>
  <text x="270" y="356" font-size="16" font-weight="800" fill="#15803d">② Sonde du BAS</text>
  <text x="270" y="376" font-size="14" fill="#1f2937">obligatoire · au tiers inférieur,</text>
  <text x="270" y="394" font-size="14" fill="#1f2937">contre la cuve sous l'isolant</text>
  <text x="270" y="416" font-size="14" fill="#4b5563">→ détecte les puisages</text>
  <text x="270" y="434" font-size="14" fill="#4b5563">→ juge l'anti-légionelle</text>

  <!-- Variante : doigt de gant -->
  <circle cx="155" cy="414" r="6" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
  <path d="M161 414 Q210 470 262 470" fill="none" stroke="#15803d" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="270" y="466" font-size="14" fill="#15803d" font-weight="700">ou dans le doigt de gant</text>
  <text x="270" y="484" font-size="14" fill="#15803d">du thermostat (pâte thermique)</text>

  <!-- À éviter -->
  <text x="270" y="548" font-size="15" font-weight="800" fill="#dc2626">✗ jamais sur le tuyau</text>
  <text x="270" y="566" font-size="14" fill="#dc2626">d'eau chaude : il est froid au</text>
  <text x="270" y="584" font-size="14" fill="#dc2626">repos et chauffe pendant un puisage</text>
  <!-- Réglages recommandés -->
  <rect x="16" y="636" width="548" height="248" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="34" y="666" font-size="17" font-weight="800" fill="#111827">Réglages recommandés <tspan font-size="14" font-weight="400" fill="#4b5563">(page Réglages)</tspan></text>

  <text x="34" y="708" font-size="21" font-weight="800" fill="#c2410c">55–60 °C</text>
  <text x="150" y="700" font-size="15" font-weight="700" fill="#111827">Température souhaitée</text>
  <text x="150" y="719" font-size="13.5" fill="#4b5563">sous 55 °C les légionelles se développent ;</text>
  <text x="150" y="736" font-size="13.5" fill="#4b5563">au-delà de 60 °C : calcaire et pertes</text>

  <text x="34" y="776" font-size="21" font-weight="800" fill="#2563eb">40 °C</text>
  <text x="150" y="768" font-size="15" font-weight="700" fill="#111827">Température minimale utile</text>
  <text x="150" y="787" font-size="13.5" fill="#4b5563">une douche se prend vers 38–40 °C</text>
  <text x="150" y="804" font-size="13.5" fill="#4b5563">(affichée avec la chauffe prédictive)</text>

  <text x="34" y="844" font-size="21" font-weight="800" fill="#15803d">7 jours</text>
  <text x="150" y="836" font-size="15" font-weight="700" fill="#111827">Chauffe anti-légionelle</text>
  <text x="150" y="855" font-size="13.5" fill="#4b5563">rubrique Mode absence, mais active aussi</text>
  <text x="150" y="872" font-size="13.5" fill="#4b5563">au quotidien en chauffe prédictive · jamais 0</text>
</svg>
